[project]
name = "vintraxo_arabic"
authors = [{name = "VintraXo", email = "boda10043@gmail.com"}]
description = "Portable Arabic translations for Frappe and installed business apps"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "license.txt"}
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.flit.sdist]
include = ["tests/", "DEPLOYMENT_AR.md"]
